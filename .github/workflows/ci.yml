name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wingz_rides
          POSTGRES_USER: wingz
          POSTGRES_PASSWORD: wingz_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wingz -d wingz_rides"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: wingz_rides
      POSTGRES_USER: wingz
      POSTGRES_PASSWORD: wingz_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Check code quality
        run: |
          ruff check .
          ruff format --check .

      - name: Check Django configuration and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

      - name: Run test suite
        run: pytest

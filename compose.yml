services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wingz_rides}
      POSTGRES_USER: ${POSTGRES_USER:-wingz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wingz_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wingz} -d ${POSTGRES_DB:-wingz_rides}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
